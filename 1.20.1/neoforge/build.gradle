plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev.legacyforge' version '2.0.141'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// NeoForge 1.20.1 uses Java 17
java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

legacyForge {
    // NeoForge 1.20.1 retained Forge's package and metadata namespaces. The
    // legacy ModDev adapter is the supported way to consume this transitional
    // artifact; the old UserDev plugin applies its coremods to named classes
    // and crashes dedicated servers after readiness.
    enable {
        neoForgeVersion = "${minecraft_version}-${neo_version}"
    }

    runs {
        client {
            client()
            gameDirectory = providers.gradleProperty('usefulToolsSmokeGameDir')
                    .map { file(it) }
                    .getOrElse(file('runs/client'))
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
        }
        server {
            server()
            programArgument '--nogui'
            gameDirectory = providers.gradleProperty('usefulToolsSmokeGameDir')
                    .map { file(it) }
                    .getOrElse(file('runs/server'))
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = providers.gradleProperty('usefulToolsSmokeGameDir')
                    .map { file(it) }
                    .getOrElse(file('runs/gametest'))
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
        }
        data {
            data()
            gameDirectory = file('runs/data')
            programArguments.addAll '--mod', mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// NeoGradle's JavaExec task does not forward the Gradle process stdin by
// default. Dedicated-server validation (and normal developer use) needs the
// Minecraft console so `stop` can exercise a graceful save/shutdown path.
tasks.withType(JavaExec).configureEach {
    if (name in ['runServer', 'runGameTestServer']) standardInput = System.in
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    runtimeClasspath.extendsFrom localRuntime
}
obfuscation.createRemappingConfiguration(configurations.localRuntime)

repositories {
    maven { url 'https://maven.fabricmc.net/' }
    // Put repositories for dependencies here.
    // NeoGradle automatically adds the NeoForge maven and Maven Central for you.
    maven { // JEI
        url "https://maven.blamejared.com/"
    }
    maven { // Jade (Modrinth)
        url "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
    maven { // REI
        url "https://maven.shedaniel.me/"
    }
    maven { // Architectury (REI dependency)
        url "https://maven.architectury.dev/"
    }
}

dependencies {
    // Annotation-only companion for optional viewer API class metadata.
    compileOnly 'net.fabricmc:fabric-loader:0.18.4'
    // JEI — compile against API only (no NeoForge runtime build exists for 1.20.1;
    // JEI NeoForge builds start at 1.20.4. The jei-1.20.1-forge jar requires Forge's
    // FML loader and cannot load on NeoForge.)
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"

    // Jade — compile against API only. Opt into the development runtime with
    // -PusefulToolsJadeRuntime=true so the default launch also proves that the
    // optional viewer is not required.
    // WTHIT does not have an official build compatible with NeoForge 1.20.1,
    // so this project mirrors the Forge sibling's choice of Jade.
    compileOnly "maven.modrinth:jade:${jade_version}"
    if (providers.gradleProperty('usefulToolsJadeRuntime').orNull == 'true') {
        modLocalRuntime "maven.modrinth:jade:${jade_version}"
    }

    // REI — source compatibility only. REI 12 publishes no NeoForge 1.20.1
    // runtime, and its Forge/Architectury mixins are incompatible with NeoForge.
    compileOnly "me.shedaniel:RoughlyEnoughItems-api-forge:${rei_version}"
    compileOnly "me.shedaniel.cloth:basic-math:0.6.1"
    compileOnly "dev.architectury:architectury-forge:9.2.14"
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
// When "copyIdeResources" is enabled, this will also run before the game launches in IDE environments.
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            forge_version_range    : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

// Example for how to get properties into the manifest for reading at runtime.
tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title'    : mod_id,
            'Specification-Vendor'   : mod_authors,
            'Specification-Version'  : '1', // We are version 1 of ourselves
            'Implementation-Title'   : project.name,
            'Implementation-Version' : project.jar.archiveVersion,
            'Implementation-Vendor'  : mod_authors
        ])
    }
}

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    // Optional viewer APIs carry Fabric @Environment annotations; Fabric API is
    // intentionally absent from this loader's runtime.
    options.compilerArgs.add('-Xlint:-classfile')
}

// IntelliJ no longer downloads javadocs and sources by default.
// This tells Gradle to force IDEA to do it.
idea.module { downloadJavadoc = downloadSources = true }
