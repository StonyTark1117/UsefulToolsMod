plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.0.192'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// NeoForge 1.20.2 uses Java 17
java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

runs {
    // applies to all the run configs below
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'

        modSource project.sourceSets.main
    }

    client {
        workingDirectory file(findProperty('usefulToolsSmokeGameDir') ?: 'runs/client')
        systemProperty 'forge.enabledGameTestNamespaces', mod_id
    }

    server {
        workingDirectory file(findProperty('usefulToolsSmokeGameDir') ?: 'runs/server')
        argument '--nogui'
        systemProperty 'forge.enabledGameTestNamespaces', mod_id
    }

    gameTestServer {
        workingDirectory file(findProperty('usefulToolsSmokeGameDir') ?: 'runs/gametest')
        systemProperty 'forge.enabledGameTestNamespaces', mod_id
    }

    data {
        arguments.addAll '--mod', mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

// NeoGradle's JavaExec task does not forward the Gradle process stdin by
// default. Dedicated-server validation (and normal developer use) needs the
// Minecraft console so `stop` can exercise a graceful save/shutdown path.
tasks.withType(JavaExec).configureEach {
    if (name in ['runServer', 'runGameTestServer']) standardInput = System.in
}


// Keep optional client integrations out of the headless provider lifecycle.
// They remain on normal client/server runtime classpaths for compatibility tests.
tasks.withType(JavaExec).configureEach {
    if (name == 'runData') {
        doFirst {
            classpath = classpath.filter {
                !it.name.startsWith('RoughlyEnoughItems-')
                        && !it.name.startsWith('architectury-')
                        && !it.name.startsWith('jade-')
            }
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven { url 'https://maven.fabricmc.net/' }
    // Put repositories for dependencies here.
    // NeoGradle automatically adds the NeoForge maven and Maven Central for you.
    maven { // JEI
        url "https://maven.blamejared.com/"
    }
    maven { // Jade (Modrinth)
        url "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
    maven { // REI
        url "https://maven.shedaniel.me/"
    }
    maven { // Architectury (REI dependency)
        url "https://maven.architectury.dev/"
    }
}

dependencies {
    // Annotation-only companion for optional viewer API class metadata.
    compileOnly 'net.fabricmc:fabric-loader:0.18.4'
    // Specify the version of NeoForge to use.
    implementation "net.neoforged:neoforge:${neo_version}"

    // JEI — compile against API only (no NeoForge runtime build exists for 1.20.2;
    // JEI NeoForge builds start at 1.20.4. The jei-1.20.2-forge jar requires Forge's
    // FML loader and cannot load on NeoForge.)
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"

    // Jade — compile against API only; opt into the development runtime.
    // WTHIT does not have an official build compatible with NeoForge 1.20.2,
    // so this project mirrors the Forge sibling's choice of Jade.
    compileOnly "maven.modrinth:jade:${jade_version}"
    if (providers.gradleProperty('usefulToolsJadeRuntime').orNull == 'true') {
        runtimeOnly "maven.modrinth:jade:${jade_version}"
    }

    // REI — compile against API + transitive deps, full jar at runtime for testing
    compileOnly "me.shedaniel:RoughlyEnoughItems-api-neoforge:${rei_version}"
    compileOnly "me.shedaniel.cloth:basic-math:0.6.1"
    compileOnly "dev.architectury:architectury-neoforge:10.0.17"
    if (providers.gradleProperty('usefulToolsReiRuntime').orNull == 'true') {
        runtimeOnly "me.shedaniel:RoughlyEnoughItems-neoforge:${rei_version}"
    }
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
// When "copyIdeResources" is enabled, this will also run before the game launches in IDE environments.
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

// Example for how to get properties into the manifest for reading at runtime.
tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title'    : mod_id,
            'Specification-Vendor'   : mod_authors,
            'Specification-Version'  : '1', // We are version 1 of ourselves
            'Implementation-Title'   : project.name,
            'Implementation-Version' : project.jar.archiveVersion,
            'Implementation-Vendor'  : mod_authors
        ])
    }
}

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    // Optional viewer APIs carry Fabric @Environment annotations; Fabric API is
    // intentionally absent from this loader's runtime.
    options.compilerArgs.add('-Xlint:-classfile')
}

// IntelliJ no longer downloads javadocs and sources by default.
// This tells Gradle to force IDEA to do it.
idea.module { downloadJavadoc = downloadSources = true }
