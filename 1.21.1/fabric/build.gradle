plugins {
	id 'fabric-loom' version '1.15.5'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

loom {
	accessWidenerPath = file("src/main/resources/usefultoolsmod.accesswidener")

	runs {
		client {
			client()
			runDir providers.gradleProperty('usefulToolsSmokeGameDir')
					.map { projectDir.toPath().relativize(file(it).toPath()).toString() }
					.getOrElse('run')
		}
		server {
			server()
			runDir providers.gradleProperty('usefulToolsSmokeGameDir')
					.map { projectDir.toPath().relativize(file(it).toPath()).toString() }
					.getOrElse('run')
		}
		gameTestServer {
			inherit server
			name "GameTest Server"
			vmArg "-Dfabric-api.gametest"
			vmArg "-Dfabric-api.gametest.report-file=${file('build/gametest-report.xml')}"
			runDir providers.gradleProperty('usefulToolsSmokeGameDir')
					.map { projectDir.toPath().relativize(file(it).toPath()).toString() }
					.getOrElse('build/gametest')
		}
		datagen {
			inherit server
			name "Data Generation"
			vmArg "-Dfabric-api.datagen"
			vmArg "-Dfabric-api.datagen.output-dir=${file("src/main/generated")}"
			vmArg "-Dfabric-api.datagen.modid=usefultoolsmod"
			runDir "build/datagen"
		}
	}
}

tasks.withType(JavaExec).configureEach {
	if (name in ['runServer', 'runGameTestServer']) standardInput = System.in
}

sourceSets {
	main {
		resources {
			srcDirs += ["src/main/generated"]
			exclude ".cache/**"
		}
	}
}

repositories {
	maven { url "https://maven.terraformersmc.com/" }
	maven { url "https://maven.shedaniel.me/" }
	maven { url "https://maven.bai.lol" }
	maven { url "https://maven.blamejared.com" }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	modCompileOnly "mezz.jei:jei-${project.minecraft_version}-fabric-api:${project.jei_version}"
	if (providers.gradleProperty("usefulToolsJeiRuntime").orElse("false").get().toBoolean()) {
		modLocalRuntime "mezz.jei:jei-${project.minecraft_version}-fabric:${project.jei_version}"
	}

	// WTHIT — optional; compile against the API, full mod in dev runtime for testing
	modCompileOnly  "mcp.mobius.waila:wthit-api:fabric-${project.wthit_version}"
	if (providers.gradleProperty("usefulToolsWthitRuntime").orElse("false").get().toBoolean()) {
		modLocalRuntime "mcp.mobius.waila:wthit:fabric-${project.wthit_version}"
	}
	modCompileOnly "com.terraformersmc:modmenu:${modmenu_version}"
	if (providers.gradleProperty("usefulToolsModMenuRuntime").orElse("false").get().toBoolean()) {
		modLocalRuntime "com.terraformersmc:modmenu:${modmenu_version}"
	}

	testImplementation platform("org.junit:junit-bom:5.12.2")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.compilerArgs += ["-Xlint:deprecation"]
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("../../LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			artifact jar
		}
	}
	repositories {
		maven {
			url "file://${project.projectDir}/mcmodsrepo"
		}
	}
}
