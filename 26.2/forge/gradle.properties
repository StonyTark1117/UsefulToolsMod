org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.configuration-cache.problems=warn

net.minecraftforge.gradle.merge-source-sets=true


## Environment Properties

# The Minecraft version must agree with the Forge version to get a valid artifact
minecraft_version=26.2
# The Minecraft version range can use any release version of Minecraft as bounds.
minecraft_version_range=[26.2,27)
# The Forge version targeting Minecraft 26.2
forge_version=26.2-65.1.2
# The Forge version range
forge_version_range=[65,)
# The FML loader version range for Forge 26.2
loader_version_range=[65,)


## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale.
mod_id=usefultoolsmod
# The human-readable display name for the mod.
mod_name=The Useful Tools Mod
# The license of the mod.
mod_license=CC0-1.0
# The mod version.
mod_version=2.3.1+mc.26.2.forge
# The group ID for the mod.
mod_group_id=com.stonytark.usefultoolsmod
# The authors of the mod.
mod_authors=stonytark_mkii
# The description of the mod.
mod_description=A simple mod adding various tools and armor based on reinforced versions of common materials.


## Optional integration versions
##
## State as of 2026-08-25:
##   - WTHIT 20.0.0: published for Fabric/NeoForge only. Forge 19.0.1 targets
##     26.1 and crashes on 26.2, so its adapter is excluded here.
##   - Config screen: built-in via Forge's ConfigScreenHandler — no Cloth Config dep needed.
##   - JEI / REI / EMI / Cloth Config / JER: no Forge 26.2 build upstream.
##     Their adapters stay excluded from compileJava until then.
##
## When an integration ships a Forge 26.2 build, add its exact dependency in
## build.gradle, restore its metadata block, and drop the matching source exclude.

# Just Enough Resources (JER) has no compatible 26.2 build and is omitted.
